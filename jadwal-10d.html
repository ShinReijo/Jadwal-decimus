<style>

.hint{font-size:14px;color:var(--mut);min-height:20px;margin:6px 4px}

.nm{font-size:19px;font-weight:600;line-height:1.2}
.fn{font-size:14px;color:var(--mut)}

.row.open .det{display:block}
.row.done{opacity:.55}
.row.done .nm{text-decoration:line-through}
.row.done .ck{background:var(--c);border-color:var(--c);color:#0b0d1c}
.row.now{border-color:var(--c);background:var(--tint);animation:glow 2.4s ease-in-out infinite;box-shadow:0 0 12px var(--c)}
.row.dim{opacity:.2}
.row.hit{border-color:var(--c)}
.brk{background:transparent;border-style:dashed;padding:8px 14px;color:var(--mut);font-size:14px;cursor:default;backdrop-filter:none}
.brk.now{color:var(--ink);animation:none;background:transparent}
.grid{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;margin-top:6px;scroll-snap-type:x mandatory}
.col{flex:0 0 78%;max-width:300px;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:20px;padding:10px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
@media (min-width:900px){.col{flex:1 1 0;max-width:none}}
.col h2{margin:2px 6px 10px;font-size:18px;font-weight:700;color:var(--c)}
.col .list{gap:8px}
.col .row{padding:8px 10px 8px 4px;gap:6px;border-radius:14px;backdrop-filter:none}
.col .num{--s:32px;flex-basis:48px;height:34px;font-size:12px}
.col .nm{font-size:16px}
.col .ck{display:none}
.src{text-align:center;font-size:13px;color:var(--mut);margin-top:22px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
